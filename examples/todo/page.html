<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI to-do list · byoa example</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem } h2 { font-size: 1rem; margin: 1.6rem 0 .4rem }
  .muted { color: #777 } .ok { color: #187a3a } .bad { color: #b3261e } .plan { width: 9.5rem; white-space: nowrap }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .35rem 0 }
  input, select, textarea, button { font: inherit }
  input, select, textarea { padding: .35rem .5rem; border: 1px solid #ccc; border-radius: 6px; background: #fff }
  textarea { width: 100%; box-sizing: border-box }
  button { padding: .35rem .8rem; border: 1px solid #222; border-radius: 6px; background: #222; color: #fff; cursor: pointer }
  button.quiet { background: #fff; color: #222 } button:disabled { opacity: .5; cursor: default }
  ul#todos { list-style: none; padding: 0 } ul#todos li { padding: .35rem 0; border-bottom: 1px solid #eee }
  li.done { color: #999; text-decoration: line-through }
  pre#log { background: #f6f6f6; padding: .6rem .8rem; border-radius: 6px; white-space: pre-wrap; font-size: 13px; max-height: 320px; overflow: auto }
</style>
<body>
<h1>AI to-do list</h1>
<p class="muted">An example app on <a href="https://github.com/madeyexz/byoa">byoa</a>: your own Claude Code, Codex or Grok Build, on your own plan, manages your to-dos.</p>
<div class="row">You are <input id="user" placeholder="your name" size="14"> <span class="muted">(a stand-in for the app's own sign-in)</span></div>

<h2>1. Sign in to your own plan</h2>
<div id="plans"></div>
<div id="signin"></div>

<h2>2. Connect your tools, one time</h2>
<div class="row"><button id="connect">Connect my to-dos</button><span id="mcp" class="muted"></span></div>
<div class="row"><input id="mcpurl" placeholder="https://mcp.notion.com/mcp" size="26"><input id="mcpname" placeholder="notion" size="8"><button class="quiet" id="other">Connect another MCP server</button></div>

<h2>3. Ask the agent</h2>
<textarea id="task" rows="4" placeholder="Add 'buy milk' and 'call mom', then mark the oldest to-do done"></textarea>
<div class="row"><select id="harness"></select><select id="model" hidden></select><button id="ask">Ask</button></div>
<pre id="log" hidden></pre>

<h2>Your to-dos</h2>
<ul id="todos"></ul>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
const PLANS = { claude: 'Claude', codex: 'ChatGPT', grok: 'Grok', 'opencode-go': 'OpenCode Go (beta)' }
const HARNESSES = { claude: 'Claude Code', codex: 'Codex', grok: 'Grok Build', fake: 'Fake harness (no model)' }
const user = $('user')
user.value = localStorage.user ?? ''
user.onchange = () => { localStorage.user = user.value.trim(); refresh() }

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { 'x-user': user.value.trim(), 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
  if (!r.ok) throw new Error((await r.json()).error)
  return r
}
const api = async (method, path, body) => (await call(method, path, body)).json()
const fail = (e) => { $('signin').innerHTML = `<p class="bad">${esc(e.message)}</p>` }

async function refresh() {
  if (!user.value.trim()) return
  const s = await api('GET', '/api/state')
  const typed = $('gokey')?.value ?? ''
  $('plans').innerHTML = Object.entries(s.login).map(([h, st]) => `<div class="row"><b class="plan">${PLANS[h]}</b>
    <span class="${st === 'signed-in' ? 'ok' : 'bad'}">${st}</span>
    ${h === 'opencode-go'
      // OpenCode Go has no sign-in page for apps: the user makes an API key in OpenCode's Console and pastes it here
      ? `<input id="gokey" type="password" autocomplete="off" placeholder="oc_sk_…" size="22"><button class="quiet" data-key="save">Save key</button><a class="muted" href="https://opencode.ai/console" target="_blank" rel="noopener">make a key</a>${st === 'signed-out' ? '' : '<button class="quiet" data-key="remove">Remove key</button>'}`
      : `<button class="quiet" data-login="${h}">${st === 'signed-in' ? 'Sign in again' : 'Sign in'}</button>`}</div>`).join('')
  $('gokey').value = typed
  $('mcp').textContent = s.mcp.length ? `Connected: ${s.mcp.map((m) => m.name).join(', ')}` : 'Nothing connected yet'
  const pick = $('harness').value
  const go = s.login['opencode-go'] === 'signed-out' ? [] : ['claude', 'codex'].map((h) => `<option value="${h}+go">${HARNESSES[h]} on OpenCode Go</option>`)
  $('harness').innerHTML = [...s.harnesses.map((h) => `<option value="${h}">${HARNESSES[h]}</option>`), ...go].join('')
  if (pick && [...$('harness').options].some((x) => x.value === pick)) $('harness').value = pick
  pickModel()
  $('todos').innerHTML = s.todos.map((t) => `<li class="${t.done ? 'done' : ''}">${esc(t.title)}</li>`).join('')
    || '<li class="muted">No to-dos yet. Ask the agent to add some.</li>'
}

// The sign-in sandbox lives only while this page checks in (finishLogin every 30 s or more often); Cancel, or leaving
// the page, ends it at once (cancelLogin).
let signingIn
const endSignIn = () => { clearInterval(signingIn?.beat); signingIn = undefined }
const finished = (r) => { endSignIn(); $('signin').innerHTML = r.error ? `<p class="bad">${esc(r.error)}</p>` : ''; refresh() }
const cancelSignIn = () => {
  if (!signingIn) return
  const h = signingIn.h
  endSignIn()
  $('signin').innerHTML = ''
  refresh()
  return api('POST', '/api/login/cancel', { harness: h })
}
addEventListener('pagehide', () => { if (signingIn) navigator.sendBeacon(`/api/login/cancel?user=${encodeURIComponent(user.value.trim())}`, JSON.stringify({ harness: signingIn.h })) })
$('plans').onclick = async (e) => {
  if (e.target.dataset.key === 'save') {
    return api('POST', '/api/key', { key: $('gokey').value }).then((r) => {
      $('gokey').value = ''
      $('signin').innerHTML = r.error ? `<p class="bad">${esc(r.error)}</p>` : ''
      models = undefined
      refresh()
    }, fail)
  }
  if (e.target.dataset.key === 'remove') return api('POST', '/api/key/remove', {}).then(refresh, fail)
  const h = e.target.dataset.login
  if (!h) return
  e.target.disabled = true
  $('signin').innerHTML = '<p class="muted">Starting the sign-in…</p>'
  try {
    const s = await api('POST', '/api/login', { harness: h })
    signingIn = { h }
    const cancel = '<button class="quiet" id="cancel">Cancel</button>'
    if (h === 'claude') {
      $('signin').innerHTML = `<p>Open <a href="${esc(s.url)}" target="_blank" rel="noopener">Anthropic's sign-in page</a>, sign in, and paste the code it shows:</p>
        <div class="row"><input id="code" size="40"><button id="finish">Finish</button>${cancel}</div>`
      $('cancel').onclick = cancelSignIn
      // while the user is on Anthropic's page: a check-in with no code keeps the sign-in alive
      signingIn.beat = setInterval(() => api('POST', '/api/login/finish', { harness: h }).then((r) => { if (r.state !== 'pending' && signingIn?.h === h) finished(r) }, () => {}), 30_000)
      $('finish').onclick = () => api('POST', '/api/login/finish', { harness: h, code: $('code').value }).then(finished, fail)
    } else {
      $('signin').innerHTML = `<p>Open <a href="${esc(s.url)}" target="_blank" rel="noopener">${h === 'grok' ? "xAI's" : "OpenAI's"} sign-in page</a> and enter the code <b>${esc(s.code)}</b>. Waiting for you… ${cancel}</p>`
      $('cancel').onclick = cancelSignIn
      // each call waits up to 20 s for the user, and keeps the sign-in alive
      let r
      do r = await api('POST', '/api/login/finish', { harness: h }); while (r.state === 'pending' && signingIn?.h === h)
      if (signingIn?.h === h) finished(r)
    }
  } catch (err) { endSignIn(); fail(err) }
}

// a job on OpenCode Go needs a model of that plan: byoa lists them from OpenCode's API, with no sandbox
let models
async function pickModel() {
  const on = $('harness').value.endsWith('+go')
  $('model').hidden = !on
  if (!on || models) return
  models = await api('GET', '/api/models').catch((e) => { models = undefined; fail(e); return [] })
  $('model').innerHTML = models.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')
}
$('harness').onchange = pickModel

$('connect').onclick = () => api('POST', '/api/connect', {}).then(refresh, fail)
$('other').onclick = () => api('POST', '/api/connect', { url: $('mcpurl').value, name: $('mcpname').value })
  .then((r) => r.connected ? refresh() : (location.href = r.signInUrl), fail)

const say = (e) => ({
  start: `▶ ${HARNESSES[e.harness]} (${e.version}), in a new ${e.sandbox} sandbox`,
  text: e.text,
  tool_call: `→ ${e.server ? e.server + '.' : ''}${e.name} ${JSON.stringify(e.input)}`,
  tool_result: `${e.ok ? '✓' : '✗'} ${e.output}`,
  permission: `denied: ${e.tool}`,
  error: `error (${e.code}): ${e.message}`,
  end: e.ok ? `■ done${e.result ? ': ' + e.result : ''}` : '■ the job failed',
})[e.type]

$('ask').onclick = async () => {
  const log = $('log')
  log.hidden = false
  log.textContent = ''
  $('ask').disabled = true
  try {
    const [harness, go] = $('harness').value.split('+')
    const r = await call('POST', '/api/ask', { harness, task: $('task').value, ...(go ? { plan: 'opencode-go', model: $('model').value } : {}) })
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader()
    let buf = ''
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      buf += value
      for (let k; (k = buf.indexOf('\n')) >= 0; buf = buf.slice(k + 1)) {
        const e = JSON.parse(buf.slice(0, k))
        log.textContent += say(e) + '\n'
        if (e.type === 'tool_result') refresh()
      }
    }
  } catch (err) { log.textContent += err.message }
  $('ask').disabled = false
  refresh()
}
refresh().catch(fail)
</script>
