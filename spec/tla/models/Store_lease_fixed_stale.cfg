\* expect: violated NoStrayLease
\* the fix needs a get that reads the latest write: a stale read after a lost answer does not show the job's own lease, and a take that gives up does not give it back
\* set: full
CONSTANTS
  Adapter = "atomic"
  StaleRead = 1
  LostAck = TRUE
  Retry = FALSE
  ABA = FALSE
  Faults = 1
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 0
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = TRUE
SPECIFICATION Spec
INVARIANT NoStrayLease
