\* expect: violated WorksWhileRunning
\* the job token's time starts at issue, before the wait in line, so a job that waited longer than 5 minutes loses its MCP servers and its plan's relay while its harness runs (agents.ts:276, job.ts:220)
\* set: fast
CONSTANTS
  Jobs = {j1}
  None = None
  Reqs = 2
  Run = 2
  TTL = 3
  MaxWait = 3
  MaxTime = 8
  Extend = FALSE
  Crash = FALSE
SPECIFICATION Spec
INVARIANT WorksWhileRunning
