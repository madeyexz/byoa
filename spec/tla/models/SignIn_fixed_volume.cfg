\* expect: ok
\* the same with cliLogin (the login in the volume; about 1 minute)
\* set: full
CONSTANTS
  Procs = {p1, p2}
  None = None
  MaxCalls = 4
  MaxStarts = 2
  Max = 4
  Idle = 2
  Wait = 1
  MaxTime = 3
  LastCall = 3
  Crash = FALSE
  DestroyFails = FALSE
  Fix = {"record", "fence", "derive", "undo", "keep"}
  Driver = "volume"
  Kinds = {"start", "finish", "cancel", "signout"}
SPECIFICATION Spec
INVARIANT SignOutWins
INVARIANT CancelEnds
INVARIANT NoStray
INVARIANT Cap
