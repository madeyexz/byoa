\* expect: ok
\* with undo: a cancelLogin wins over a finishLogin that has not committed, and a stored login is never signed-out
\* set: fast
CONSTANTS
  Procs = {p1, p2}
  None = None
  MaxCalls = 3
  MaxStarts = 1
  Max = 4
  Idle = 2
  Wait = 1
  MaxTime = 3
  LastCall = 3
  Crash = FALSE
  DestroyFails = FALSE
  Fix = {"record", "fence", "derive", "undo", "keep"}
  Driver = "stored"
  Kinds = {"start", "finish", "cancel"}
SPECIFICATION Spec
INVARIANT CancelWins
INVARIANT InTrue
INVARIANT StateTrue
INVARIANT CancelEnds
INVARIANT NoStray
