\* expect: violated Linearizable
\* postgresStore whose query sends a select to a read replica answers a get with an older entry
\* set: fast
CONSTANTS
  Adapter = "postgres"
  StaleRead = 1
  LostAck = FALSE
  Retry = FALSE
  ABA = FALSE
  Faults = 0
  Client = "ops"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 1
  Removes = 0
  OpsPerProc = 2
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
PROPERTY Linearizable
