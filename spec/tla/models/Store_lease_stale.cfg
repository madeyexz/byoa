\* expect: ok
\* stale reads cannot steal a lease: a cas with an old version fails (versions never repeat)
\* set: fast
CONSTANTS
  Adapter = "atomic"
  StaleRead = 1
  LostAck = FALSE
  Retry = FALSE
  ABA = FALSE
  Faults = 0
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 1
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
PROPERTY NoSteal
