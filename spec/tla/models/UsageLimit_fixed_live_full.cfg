\* expect: ok
\* a hold always ends, a job of a live backend ends, and after the hold a job runs, also with sign-ins, sign-outs and backends that die
\* set: full
CONSTANTS
  Jobs = {j1, j2}
  Changes = {c1}
  None = None
  Plan = TRUE
  MaxSet = TRUE
  CasClear = TRUE
  Kinds = {"signin", "signout"}
  MaxTime = 4
  Hold = 2
  MaxUsedUp = 1
  OldHold = TRUE
  Crash = TRUE
SPECIFICATION Spec
PROPERTY HoldEnds JobsEnd AfterHoldJobRuns
