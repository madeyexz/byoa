\* expect: ok
\* update() of one index by two writers and a remove, on a linearizable store: no item is lost, every update ends
\* set: ci
CONSTANTS
  Adapter = "atomic"
  StaleRead = 0
  LostAck = FALSE
  Retry = FALSE
  ABA = FALSE
  Faults = 0
  Client = "index"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 1
  Removes = 0
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
INVARIANT NoLostUpdate
PROPERTY Termination
PROPERTY Refines
