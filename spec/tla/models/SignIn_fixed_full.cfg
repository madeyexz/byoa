\* expect: ok
\* 3 backends (connect, finish and signOut or cancel each on its own), two sign-ins in a row, jobs, and backends that die
\* set: full
CONSTANTS
  Procs = {p1, p2, p3}
  None = None
  MaxCalls = 6
  MaxStarts = 2
  Max = 4
  Idle = 2
  Wait = 1
  MaxTime = 3
  LastCall = 3
  Crash = TRUE
  DestroyFails = FALSE
  Fix = {"record", "fence", "derive", "undo", "keep", "again"}
  Driver = "stored"
  Kinds = {"start", "finish", "cancel", "signout", "job"}
SPECIFICATION Spec
INVARIANT SignOutWins
INVARIANT StateTrue
INVARIANT CancelEnds
INVARIANT Cap
INVARIANT NoJobAfterSignOut
