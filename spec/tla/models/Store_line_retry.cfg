  Retry = TRUE
  ABA = FALSE
  Faults = 1
  Client = "line"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 1
  Removes = 0
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
INVARIANT FIFO
INVARIANT NoStrayTicket
PROPERTY Termination
