\* expect: violated NoOrphan
\* left open: a backend that dies in its write, while a remove runs, can still leave one entry (a store with no transactions cannot rule it out)
\* set: fast
CONSTANTS
  Kind = "slot"
  PreAdd = TRUE
  PostAdd = TRUE
  Recheck = TRUE
  Crash = TRUE
  Writers = {w1, w2}
  Removes = 2
SPECIFICATION Spec
INVARIANT NoOrphan
