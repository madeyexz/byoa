  StaleRead = 0
  LostAck = TRUE
  Retry = FALSE
  ABA = FALSE
  Faults = 1
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 1
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = TRUE
SPECIFICATION Spec
INVARIANT NoStrayLease
PROPERTY NoSteal
