\* expect: ok
\* fix2 on Postgres with lost answers, retries, failed reads (two faults), waitMs and a deleteSandbox
\* set: full
CONSTANTS
  Adapter = "postgres"
  StaleRead = 0
  LostAck = TRUE
  Retry = TRUE
  ABA = FALSE
  Faults = 2
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 1
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = TRUE
  Wait = TRUE
SPECIFICATION Spec
INVARIANT NoStrayLease
PROPERTY NoSteal
