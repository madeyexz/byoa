\* expect: ok
\* slots.take, set, renew and give-back by two jobs and a deleteSandbox, on a linearizable store (fix2.patch): no steal, no stray lease
\* set: fast
CONSTANTS
  Adapter = "atomic"
  StaleRead = 0
  LostAck = FALSE
  Retry = FALSE
  ABA = FALSE
  Faults = 0
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 1
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
INVARIANT NoStrayLease
PROPERTY NoSteal
PROPERTY Refines
