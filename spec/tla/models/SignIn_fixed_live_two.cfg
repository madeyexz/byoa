\* expect: ok
\* liveness with two sign-ins (about 5 minutes on 1 core)
\* set: full
CONSTANTS
  Procs = {p1, p2}
  None = None
  MaxCalls = 3
  MaxStarts = 2
  Max = 4
  Idle = 2
  Wait = 1
  MaxTime = 10
  LastCall = 2
  Crash = TRUE
  DestroyFails = FALSE
  Fix = {"record", "fence", "derive", "undo", "keep"}
  Driver = "stored"
  Kinds = {"start", "finish", "cancel", "signout"}
SPECIFICATION FairSpec
PROPERTY SignInEnds
PROPERTY CallsEnd
