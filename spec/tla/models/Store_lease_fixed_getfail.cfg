\* expect: ok
\* fix2: a cas error is a poll that found nothing, the next poll finds the job's own lease, and a take that gives up gives it back (two faults)
\* set: fast
CONSTANTS
  Adapter = "atomic"
  StaleRead = 0
  LostAck = TRUE
  Retry = FALSE
  ABA = FALSE
  Faults = 2
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 0
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = TRUE
  Wait = TRUE
SPECIFICATION Spec
INVARIANT NoStrayLease
PROPERTY NoSteal
