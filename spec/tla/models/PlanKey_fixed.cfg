\* expect: ok
\* with the state tagged by its key and expired final for a key, the state tells the truth of the stored key; every job ends
\* set: fast
CONSTANTS
  Jobs = {j1, j2}
  Changes = {c1}
  None = None
  Kinds = {"connect", "signout"}
  Reqs = 1
  MaxKeys = 2
  MaxTruth = 2
  Tagged = TRUE
  Crash = TRUE
SPECIFICATION Spec
INVARIANT ExpiredIsTrue RefusedIsExpired
PROPERTY JobsEnd
