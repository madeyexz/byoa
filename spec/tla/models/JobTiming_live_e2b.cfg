  Jobs = {j1, j2}
  T = 1
  MaxSetup = 1
  MaxLoginWait = 1
  ArriveBy = 1
  MaxTime = 14
  Provider = "e2b"
  Crash = TRUE
  Heartbeat = TRUE
  TimeFromLogin = TRUE
  BeatTimer = TRUE
  WatchFirst = TRUE
  LongStart = TRUE
  PauseFails = FALSE
  SlotExtra = 2
  TimerExtra = 4
  WatchExtra = 3
  CheckpointEvery = 1
  RenewEvery = 1
  TicketSteps = 2
SPECIFICATION LiveSpec
INVARIANT TypeOK
PROPERTY GetsSlot
PROPERTY Ends
