\* expect: violated AnswersLast
\* assumption: a Grok that sent _x.ai/session/interjection when it queues a message (not when it takes it) makes the job end before the turn that answers it
\* set: full
CONSTANTS
  Protocol = "grok"
  Sends = 1
  TakenAtPush = TRUE
  WriteFail = FALSE
  TimeoutOn = FALSE
  TimeoutFair = FALSE
  CodexDrop = FALSE
  GrokQueueNote = TRUE
  TurnsFail = FALSE
  GrokFix = TRUE
SPECIFICATION Spec
INVARIANT AnswersLast TurnNotLast InboxRight NoDriverFail StartWhenIdle
