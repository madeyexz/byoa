\* expect: ok
\* every sign-in sandbox ends and every call of a live backend returns, with backends that die and an app that leaves
\* set: fast
CONSTANTS
  Procs = {p1, p2}
  None = None
  MaxCalls = 2
  MaxStarts = 1
  Max = 4
  Idle = 2
  Wait = 1
  MaxTime = 10
  LastCall = 2
  Crash = TRUE
  DestroyFails = FALSE
  Fix = {"record", "fence", "derive", "undo", "keep"}
  Driver = "stored"
  Kinds = {"start", "finish", "cancel", "signout"}
SPECIFICATION FairSpec
PROPERTY SignInEnds
PROPERTY CallsEnd
