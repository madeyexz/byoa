\* expect: violated NoWastedRun
\* a job that worked clears the hold that another job kept while it ran, so the next job runs on a used-up plan (job.ts:425)
\* set: ci
CONSTANTS
  Jobs = {j1, j2, j3}
  Changes = {}
  None = None
  Plan = FALSE
  MaxSet = FALSE
  CasClear = FALSE
  Kinds = {"signin"}
  MaxTime = 4
  Hold = 2
  MaxUsedUp = 1
  OldHold = TRUE
  Crash = FALSE
SPECIFICATION Spec
INVARIANT NoWastedRun
