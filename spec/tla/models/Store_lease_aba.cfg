\* expect: violated NoSteal
\* a per-row version counter: a job's cas with the version of the slot before deleteSandbox matches the slot that another job created and renewed since, and takes its live lease
\* set: fast
CONSTANTS
  Adapter = "atomic"
  StaleRead = 0
  LostAck = FALSE
  Retry = FALSE
  ABA = TRUE
  Faults = 0
  Client = "lease"
  Jobs = {j1, j2}
  Rm = rm
  RmItem = j1
  Fix = FALSE
  LeaseLen = 2
  MaxTime = 4
  Removes = 1
  OpsPerProc = 0
  TakeV = "fix"
  SetLoop = TRUE
  Beat = FALSE
  GetFail = FALSE
  Wait = FALSE
SPECIFICATION Spec
PROPERTY NoSteal
