<!-- The help agent: the robot in the corner of each page jumps in, says what it is in a speech bubble, and opens a chat with Codex, which runs in a sandbox on byoa,
     reads byoa's docs and code, and logs the visitor's feedback. Its backend is the Convex deployment of
     madeyexz/byoa-help; this page calls its functions through Convex's HTTP API. build.mjs puts this before </body>. -->
<style>
  /* the site's fonts, colors and type, set here too, so the widget looks the same on a page with other styles (/demo) */
  @font-face { font-family: "Geist"; src: url(/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url(/fonts/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  #bh, #bh-open, #bh-say { --paper: #f8f6f0; --paper2: #f1eee5; --card: #fffdf8; --rule: #e3dfd4; --rule2: #d3cdbe; --ink: #141418; --ink2: #3d3d48;
    --muted: #6b6977; --dim: #9895a1; --cobalt: #2f4cff; --cobalt2: #2238d8; --peri: #9db6ff; --peri2: #dfe6ff; --navy: #121428;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #bh-open { position: fixed; right: 20px; bottom: 16px; z-index: 60; width: 64px; height: 84px; padding: 0; border: 0; background: none; cursor: pointer; }
  #bh-open img { width: 54px; margin: 0 auto; image-rendering: pixelated; animation: bh-bob 1.6s steps(2) infinite; filter: drop-shadow(3px 3px 0 rgba(20,20,24,.18)); transform-origin: 50% 100%; }
  #bh-open:hover img, #bh-open:focus-visible img { animation: bh-wave .5s steps(2) 3; }
  #bh-open.busy img { animation-duration: .5s; }
  /* it jumps in from below the page, then hops each time it says something */
  #bh-open.enter img { animation: bh-enter .9s cubic-bezier(.3,.7,.4,1) both; }
  #bh-open.hop img { animation: bh-hop .55s ease-out; }
  @keyframes bh-bob { 50% { transform: translateY(-4px); } }
  @keyframes bh-wave { 50% { transform: rotate(-8deg) translateY(-3px); } }
  @keyframes bh-enter { 0% { transform: translateY(130%); } 55% { transform: translateY(-30px); } 75% { transform: translateY(0) scaleY(.9); } 88% { transform: translateY(-8px); } 100% { transform: none; } }
  @keyframes bh-hop { 35% { transform: translateY(-18px) rotate(-4deg); } 70% { transform: translateY(0) scaleY(.92); } }
  /* the speech bubble beside the robot while the chat is closed */
  #bh-say { position: fixed; right: 92px; bottom: 46px; z-index: 60; width: max-content; max-width: min(270px, calc(100vw - 112px)); display: flex; align-items: flex-start;
    background: var(--ink); color: var(--paper); border: 0; box-shadow: 4px 4px 0 rgba(20,20,24,.18); font: 14px/1.4 var(--sans); transition: opacity .2s, transform .2s; }
  #bh-say[hidden] { display: none; }
  #bh-say.out { opacity: 0; transform: translateY(6px); pointer-events: none; }
  /* the tail, a pixel step pointing at the robot */
  #bh-say::after { content: ""; position: absolute; right: -10px; bottom: 14px; width: 10px; height: 10px; background: var(--ink); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  #bh-say .text { all: unset; cursor: pointer; padding: 10px 4px 11px 13px; transition: opacity .18s; }
  #bh-say .text.fade { opacity: 0; }
  #bh-say .text b { color: var(--peri); font-weight: 600; }
  #bh-say .x { all: unset; cursor: pointer; padding: 6px 9px; font-size: 13px; line-height: 1; color: var(--dim); }
  #bh-say .x:hover, #bh-say .text:focus-visible, #bh-say .x:focus-visible { color: var(--paper); outline: 1px solid var(--peri); outline-offset: -1px; }
  @media (prefers-reduced-motion: reduce) { #bh-open img, #bh-open.enter img, #bh-open.hop img, #bh .work img { animation: none !important; } #bh-say, #bh-say .text { transition: none; } }
  #bh { position: fixed; right: 20px; bottom: 108px; z-index: 61; width: 390px; max-width: calc(100vw - 24px); height: min(600px, calc(100vh - 140px)); display: flex; flex-direction: column;
    background: var(--card, #fffdf8); color: var(--ink, #141418); border: 1px solid var(--ink, #141418); box-shadow: 6px 6px 0 rgba(20,20,24,.14); font: 15px/1.5 var(--sans, system-ui); }
  #bh[hidden] { display: none; }
  #bh header { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--rule, #e3dfd4); background: var(--paper, #f8f6f0); }
  #bh header img { width: 22px; image-rendering: pixelated; }
  #bh header .t { flex: 1; min-width: 0; }
  #bh header b { display: block; font-weight: 640; letter-spacing: -.01em; }
  #bh header small { display: block; color: var(--muted, #6b6977); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bh header button { width: 32px; height: 32px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 17px; color: var(--ink2, #3d3d48); }
  #bh header button:hover { background: var(--paper2, #f1eee5); border-color: var(--rule, #e3dfd4); }
  #bh .log { flex: 1; overflow: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 12px; }
  #bh .m { max-width: 92%; overflow-wrap: anywhere; }
  #bh .m.visitor { align-self: flex-end; background: var(--cobalt, #2f4cff); color: #fff; padding: 8px 12px; white-space: pre-wrap; }
  #bh .m.agent { align-self: flex-start; }
  #bh .m.agent.failed { color: var(--muted, #6b6977); }
  #bh .m p { margin: 0 0 8px; } #bh .m p:last-child { margin-bottom: 0; }
  #bh .m ul, #bh .m ol { margin: 0 0 8px; padding-left: 20px; }
  #bh .m pre { margin: 0 0 8px; background: var(--navy, #121428); color: #e8e9f5; padding: 10px 12px; overflow: auto; font: 12.5px/1.5 var(--mono, monospace); }
  #bh .m pre code { background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  #bh .m code { font: .86em/1.4 var(--mono, monospace); background: var(--paper2, #f1eee5); border: 1px solid var(--rule, #e3dfd4); padding: 1px 4px; }
  #bh .m a { color: var(--cobalt2, #2238d8); }
  #bh .hello { color: var(--ink2, #3d3d48); }
  #bh .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #bh .chips button { border: 1px solid var(--rule2, #d3cdbe); background: var(--paper, #f8f6f0); padding: 6px 10px; font: 13.5px/1.3 var(--sans, system-ui); cursor: pointer; text-align: left; color: var(--ink, #141418); }
  #bh .chips button:hover { background: var(--peri2, #dfe6ff); border-color: var(--peri, #9db6ff); }
  #bh .work { display: flex; gap: 8px; align-items: flex-start; color: var(--muted, #6b6977); font-size: 13px; }
  #bh .work img { width: 16px; margin-top: 2px; image-rendering: pixelated; animation: bh-bob .5s steps(2) infinite; }
  #bh .work ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 0; }
  #bh .work li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bh .work li.done { color: var(--dim, #9895a1); }
  #bh .work li.done::before { content: "✓ "; color: var(--mint, #2fbf8a); }
  #bh .work code { background: none; border: 0; padding: 0; font-size: 12px; }
  #bh .took { font-size: 11.5px; color: var(--dim, #9895a1); margin-top: 4px; }
  #bh .status { border-left: 3px solid var(--butter, #ffc93c); padding: 6px 0 6px 10px; color: var(--ink2, #3d3d48); }
  #bh form { display: flex; gap: 0; border-top: 1px solid var(--rule, #e3dfd4); }
  #bh textarea { flex: 1; resize: none; border: 0; padding: 12px; font: 15px/1.4 var(--sans, system-ui); background: transparent; color: inherit; height: 64px; outline: none; }
  #bh form button { width: 64px; border: 0; border-left: 1px solid var(--rule, #e3dfd4); background: var(--ink, #141418); color: var(--paper, #f8f6f0); font: 600 14px var(--sans, system-ui); cursor: pointer; }
  #bh form button:disabled { background: var(--dim, #9895a1); cursor: default; }
  #bh .err { color: #b3261e; font-size: 13px; padding: 0 14px 8px; }
  #bh .err:empty { display: none; }
  #bh .foot { font-size: 11.5px; color: var(--dim, #9895a1); padding: 6px 12px 8px; border-top: 1px solid var(--rule, #e3dfd4); }
  #bh .foot a { color: inherit; }
  @media (max-width: 520px) {
    #bh { right: 0; bottom: 0; width: 100vw; max-width: none; height: 86vh; box-shadow: 0 -6px 0 rgba(20,20,24,.1); }
    #bh-open { right: 10px; bottom: 10px; }
    #bh-say { right: 80px; bottom: 38px; font-size: 13px; }
  }
</style>
<div id="bh-say" role="status" hidden><button class="text" type="button"></button><button class="x" type="button" aria-label="Hide this message">✕</button></div>
<button id="bh-open" type="button" aria-label="Ask byoa's help agent" aria-controls="bh" aria-expanded="false"><img src="/art/agent.png" alt=""></button>
<section id="bh" role="dialog" aria-label="byoa help agent" hidden>
  <header>
    <img src="/art/agent.png" alt="">
    <div class="t"><b>byoa help agent</b><small>Codex · GPT-6 Luna · in a sandbox, on byoa</small></div>
    <button type="button" data-act="new" title="New chat" aria-label="New chat">↺</button>
    <button type="button" data-act="close" title="Close" aria-label="Close">✕</button>
  </header>
  <div class="log" aria-live="polite"></div>
  <div class="err" role="alert"></div>
  <form><textarea rows="2" placeholder="Ask about byoa, or tell us what to fix" aria-label="Message" maxlength="2000"></textarea><button type="submit">Send</button></form>
  <div class="foot">It reads byoa's docs and code, and logs your feedback for us. It runs on the maintainer's ChatGPT plan, with limits. <a href="https://github.com/madeyexz/byoa-help">Its code</a></div>
</section>
<script>
(() => {
  const API = 'https://merry-rabbit-850.convex.cloud/api/'
  const $ = (s) => document.querySelector(s)
  const box = $('#bh'), open = $('#bh-open'), log = $('#bh .log'), err = $('#bh .err'), form = $('#bh form'), input = $('#bh textarea'), send = $('#bh form button')
  let visitor = localStorage.getItem('byoa-help')
  if (!/^[0-9a-f]{32}$/.test(visitor || '')) {
    visitor = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join('')
    localStorage.setItem('byoa-help', visitor)
  }
  const call = async (kind, path, args) => {
    const r = await fetch(API + kind, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path, args: { visitor, ...args }, format: 'json' }) })
    const b = await r.json().catch(() => ({}))
    if (b.status !== 'success') throw new Error(b.errorData || b.errorMessage || 'The help agent is not reachable now.')
    return b.value
  }

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+[^\s)<.,;:])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  /** The agent's Markdown, small: code blocks, lists, paragraphs, and inline code, bold and links. */
  function md(text) {
    const out = [], lines = text.replace(/\r/g, '').split('\n')
    for (let i = 0; i < lines.length;) {
      const l = lines[i]
      if (/^```/.test(l)) {
        const code = []
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i])
        i++; out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`)
      } else if (/^\s*([-*]|\d+\.)\s/.test(l)) {
        const ol = /^\s*\d+\./.test(l), items = []
        for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`)
        out.push(ol ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`)
      } else if (!l.trim()) i++
      else {
        const p = []
        for (; i < lines.length && lines[i].trim() && !/^```|^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) p.push(lines[i].replace(/^#+\s*(.*)$/, '**$1**'))
        out.push(`<p>${p.map(inline).join('<br>')}</p>`)
      }
    }
    return out.join('')
  }

  const secs = (ms) => `${(ms / 1000).toFixed(ms < 10_000 ? 1 : 0)} s`
  /** A time the server named ({time}), in the visitor's own time zone, with the day when it is not today. */
  function when(at) {
    const d = new Date(at), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}, ${t}`
  }
  const withTime = (text, until) => until ? text.replaceAll('{time}', when(until)) : text
  /** What the agent does now, step by step: the line, the sandbox, Codex, and its last command. */
  function doing(job) {
    if (job.state === 'queued') return [job.ahead ? `Waiting in line: ${job.ahead} ahead of you` : 'Waiting for a free sandbox…']
    const start = job.events.find((x) => x.type === 'start')
    const since = Math.max(0, Date.now() - (job.started ?? Date.now()))
    if (!start) return [`Starting your sandbox and Codex… ${secs(since)}`]
    const steps = [{ done: true, text: `Sandbox ready in ${secs(start.t)}, starting Codex now` }]
    const e = [...job.events].reverse().find((x) => x.type === 'tool_call' || x.type === 'text')
    if (!e || e.type === 'text') steps.push(`Codex is thinking… ${secs(since - start.t)}`)
    else if (e.name === 'log_feedback') steps.push('Logging your feedback for the developer…')
    else {
      let cmd = e.input
      try { const i = JSON.parse(e.input); cmd = Array.isArray(i?.command) ? i.command.join(' ') : i?.command ?? e.input } catch {}
      steps.push({ code: String(cmd).replace(/^\/bin\/bash -lc |^(bash|sh) -lc /, '').replace(/^['"]|['"]$/g, '').slice(0, 120) })
    }
    return steps
  }
  const step = (x) => typeof x === 'string' ? `<li>${esc(x)}</li>` : x.done ? `<li class="done">${esc(x.text)}</li>` : `<li>Reading: <code>${esc(x.code)}</code></li>`
  const took = (m) => m.timing && m.ok !== false ? `<div class="took">Answered in ${secs(m.timing.total)}${m.timing.sandbox !== undefined ? ` · sandbox ready in ${secs(m.timing.sandbox)} · Codex ${secs(m.timing.codex)}` : ''}</div>` : ''

  const HELLO = `<div class="m agent hello"><p>Hi! I'm byoa's help agent. I'm powered by byoa itself, on the developer's own ChatGPT subscription. I read byoa's docs and code to answer you, and I can pass your feedback, and questions I can't answer, on to the developer. Try chatting with me!</p></div>`
  const CHIPS = ['What is byoa, in short?', 'How do I add byoa to a Convex app?', 'Which AI plans and sandboxes work?', 'I have feedback on the docs']
  let view = null, timer = null, sent = ''
  function render() {
    const msgs = view?.messages ?? []
    let html = HELLO + msgs.map((m) => m.role === 'visitor' ? `<div class="m visitor">${esc(m.text)}</div>` : `<div class="m agent${m.ok === false ? ' failed' : ''}">${md(withTime(m.text, m.until))}${took(m)}</div>`).join('')
    if (sent && !msgs.some((m) => m.role === 'visitor' && m.text === sent)) html += `<div class="m visitor">${esc(sent)}</div>`
    const job = view?.job
    if (job || sent) html += `<div class="work"><img src="/art/agent.png" alt=""><ol>${(job ? doing(job) : ['Sending…']).map(step).join('')}</ol></div>`
    // why the agent cannot answer now, in place of the suggestions
    else if (view?.status) html += `<div class="m agent status">${md(withTime(view.status.text, view.status.until))}</div>`
    else if (!msgs.length) html += `<div class="chips">${CHIPS.map((c) => `<button type="button">${esc(c)}</button>`).join('')}</div>`
    const end = log.scrollHeight - log.scrollTop - log.clientHeight < 40
    log.innerHTML = html
    if (end) log.scrollTop = log.scrollHeight
    send.disabled = !!(job || sent)
    open.classList.toggle('busy', !!job)
  }
  async function refresh() {
    clearTimeout(timer)
    try { view = await call('query', 'help:view', {}) } catch (e) { err.textContent = e.message }
    render()
    if (view?.job) timer = setTimeout(refresh, 1500)
  }
  // PostHog, with the visitor's page-view id (posthog.html), so a funnel joins page view, opening the chat and asking
  const track = (event) => window.posthog?.capture?.(event, { page: location.pathname + location.hash })
  async function ask(text) {
    text = text.trim()
    if (!text || send.disabled) return
    track('help_asked')
    err.textContent = ''; sent = text; input.value = ''; render()
    try {
      const r = await call('mutation', 'help:ask', { text, page: location.pathname + location.hash })
      if (r.error) { err.innerHTML = inline(withTime(r.error, r.until)); input.value = text }
    } catch (e) { err.textContent = e.message; input.value = text }
    sent = ''
    await refresh()
  }
  // the speech bubble: what the agent is and what it does, in turns, while the chat is closed; ✕ hides it for the visit
  const say = $('#bh-say'), sayText = $('#bh-say .text')
  const LINES = [
    `<b>Hi! I'm byoa's help agent.</b> I'm powered by byoa, on the developer's ChatGPT plan. Try chatting with me!`,
    `I can pass your feedback, and questions I can't answer, on to the developer.`,
  ]
  let line = 0, sayTimer = null
  const hop = (cls) => { open.classList.remove('enter', 'hop'); void open.offsetWidth; open.classList.add(cls) }
  open.addEventListener('animationend', () => open.classList.remove('enter', 'hop'))
  function speak(on) {
    clearInterval(sayTimer)
    if (!on || sessionStorage.getItem('byoa-help-quiet')) { say.classList.add('out'); return }
    say.hidden = false; sayText.innerHTML = LINES[line]; requestAnimationFrame(() => say.classList.remove('out'))
    sayTimer = setInterval(() => {
      sayText.classList.add('fade')
      setTimeout(() => { line = (line + 1) % LINES.length; sayText.innerHTML = LINES[line]; sayText.classList.remove('fade'); hop('hop') }, 180)
    }, 5000)
  }
  // a visitor opens the chat (the robot or its speech bubble); a chat that a page restores open does not count
  const openChat = () => { track('help_opened'); show(true) }
  sayText.addEventListener('click', openChat)
  $('#bh-say .x').addEventListener('click', () => { sessionStorage.setItem('byoa-help-quiet', '1'); speak(false) })

  function show(on) {
    box.hidden = !on; open.setAttribute('aria-expanded', String(on)); sessionStorage.setItem('byoa-help-open', on ? '1' : '')
    speak(!on)
    if (on) { refresh(); input.focus() } else clearTimeout(timer)
  }
  open.addEventListener('click', () => box.hidden ? openChat() : show(false))
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('button')
    if (!b) return
    if (b.dataset.act === 'close') show(false)
    else if (b.dataset.act === 'new') {
      try { const r = await call('mutation', 'help:clear', {}); err.textContent = r?.error ?? '' } catch (x) { err.textContent = x.message }
      refresh()
    } else if (b.parentElement.classList.contains('chips')) ask(b.textContent)
  })
  form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value) })
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value) } })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !box.hidden) show(false) })
  if (sessionStorage.getItem('byoa-help-open')) show(true)
  else {
    // the first page of a visit: it jumps in from below, then speaks; later pages: it is there and speaks at once
    say.classList.add('out')
    const first = !sessionStorage.getItem('byoa-help-seen')
    sessionStorage.setItem('byoa-help-seen', '1')
    if (first) { open.style.visibility = 'hidden'; setTimeout(() => { open.style.visibility = ''; hop('enter'); setTimeout(() => speak(true), 700) }, 900) }
    else speak(true)
  }
})()
</script>
