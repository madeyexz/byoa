# Publishes byoa to npm, with provenance, when a maintainer pushes a tag v<version> that matches package.json.
# It runs in the `npm` environment: set required reviewers on it (Settings → Environments), so nothing is published
# until a maintainer approves the run. Auth: the NPM_TOKEN secret of that environment (an npm automation token) for
# the first release; after it, set up trusted publishing for this workflow on npmjs.com and delete the token.
name: release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - name: The tag matches package.json
        run: test "v$(node -p 'require(\"./package.json\").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - name: Install the pinned Codex for V10
        run: |
          v=$(node -e "import('./src/harness/pins.ts').then((m) => console.log(m.PINS.codex))")
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@$v"
          echo "BYOA_CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run test:v11
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
