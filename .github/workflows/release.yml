# Publishes byoa to npm, with provenance, when a maintainer pushes a tag v<version> that matches package.json.
# It runs in the `npm` environment: set required reviewers on it (Settings → Environments), so nothing is published
# until a maintainer approves the run. Auth: trusted publishing for this workflow, set up on npmjs.com in the package's
# settings (npm sets it up only for a package that exists, so 1.0.0 was published by hand), or the NPM_TOKEN secret of
# that environment. A version that is on npm already is not published again, so the tag of a version published by
# hand passes. No dependency cache here, so a poisoned cache cannot reach a release.
name: release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - name: Install the pinned Codex for V10
        run: |
          v=$(node -e "import('./src/harness/pins.ts').then((m) => console.log(m.PINS.codex))")
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@$v"
          echo "BYOA_CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run test:v11
      - name: Is this version on npm already?
        id: npm
        run: |
          n=$(node -p 'require("./package.json").name'); v=$(node -p 'require("./package.json").version')
          if curl -sf "https://registry.npmjs.org/${n/\//%2f}/$v" >/dev/null; then echo "$n@$v is on npm already"; echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm publish
        if: steps.npm.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
