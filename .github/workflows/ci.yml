# On every commit: the typecheck, V10, the fake-harness tests and the other unit tests, V11, and the to-do example's
# fake-harness tests (SPEC.md, Verification). V1 to V9 use real providers and plans, so they run before a release, not here.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # V10 also checks that the pinned, real Codex reads the config.toml byoa writes
      - name: Install the pinned Codex for V10
        run: |
          v=$(node -e "import('./src/harness/pins.ts').then((m) => console.log(m.PINS.codex))")
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@$v"
          echo "BYOA_CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      # and that the pinned, real Grok reads the .grok/config.toml, skills and AGENTS.md byoa writes
      - name: Install the pinned Grok for V10
        run: |
          v=$(node -e "import('./src/harness/pins.ts').then((m) => console.log(m.PINS.grok))")
          GROK_HOME="$RUNNER_TEMP/grok-install" npm install --prefix "$RUNNER_TEMP/grok" --no-audit --no-fund "@xai-official/grok@$v"
          echo "BYOA_GROK_BIN=$RUNNER_TEMP/grok/node_modules/.bin/grok" >> "$GITHUB_ENV"
      - run: npm test

  v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:v11

  # The to-do example (examples/todo) with byoa's fake harness and the local sandbox: no plan, no provider
  example-todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/todo/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/todo
      - run: npm run typecheck
        working-directory: examples/todo
      - run: npm test
        working-directory: examples/todo

  example-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/mail/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/mail
      - run: npm run typecheck
        working-directory: examples/mail
      - run: npm test
        working-directory: examples/mail
