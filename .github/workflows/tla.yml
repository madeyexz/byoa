# V22 (SPEC.md, Verification): TLC checks the TLA+ models in spec/tla, when the models or the code they model change:
# the fast set (`\* set: ci`) on push and pull request, every model when run by hand (workflow_dispatch).
# Each model says what TLC must find (spec/tla/README.md): no error, or the counterexample of a known issue.
name: tla
on:
  push:
    paths:
      - spec/tla/**
      - src/job.ts
      - src/slots.ts
      - src/queue.ts
      - src/store.ts
      - src/store/**
      - src/time.ts
      - src/login.ts
      - src/login-stored.ts
      - src/conversation.ts
      - src/agents.ts
      - src/credential.ts
      - src/limits.ts
      - src/plan.ts
      - src/mcp/grants.ts
      - src/mcp/proxy.ts
      - src/harness/driver.ts
      - src/harness/claude.ts
      - src/harness/codex.ts
      - src/harness/grok.ts
      - src/sandbox/e2b.ts
      - examples/mail/store.ts
      - examples/mail/convex/**
      - .github/workflows/tla.yml
  pull_request:
    paths:
      - spec/tla/**
      - src/job.ts
      - src/slots.ts
      - src/queue.ts
      - src/store.ts
      - src/store/**
      - src/time.ts
      - src/login.ts
      - src/login-stored.ts
      - src/conversation.ts
      - src/agents.ts
      - src/credential.ts
      - src/limits.ts
      - src/plan.ts
      - src/mcp/grants.ts
      - src/mcp/proxy.ts
      - src/harness/driver.ts
      - src/harness/claude.ts
      - src/harness/codex.ts
      - src/harness/grok.ts
      - src/sandbox/e2b.ts
      - examples/mail/store.ts
      - examples/mail/convex/**
      - .github/workflows/tla.yml
  workflow_dispatch:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with: { path: spec/tla/.tools, key: tla2tools-1.7.4 }
      - run: spec/tla/check.sh
        env: { TLC_HEAP: 6g, TLA_SET: "${{ github.event_name != 'workflow_dispatch' && 'ci' || '' }}" }
